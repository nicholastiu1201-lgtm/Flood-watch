name: Flood monitor

on:
  schedule:
    - cron: "*/45 * * * *"
  workflow_dispatch:
    inputs:
      force_test_alert:
        description: "Send a test Telegram message regardless of water levels"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch levels and send alert if needed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIDECHECK_API_KEY: ${{ secrets.TIDECHECK_API_KEY }}
          FORCE_TEST_ALERT: ${{ github.event.inputs.force_test_alert }}
        run: python scripts/monitor.py

      - name: Commit updated data.json
        run: |
          git config user.name "flood-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Update water level data"
          git push
